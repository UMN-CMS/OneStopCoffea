analyzer:
  default_run_builder:
    strategy_name: NoSystematics

  supercool_first_pipeline:   
      
    - module_name: JetFilter # Make a column of the good jets/event
      input_col: Jet
      output_col: GoodJet

    - module_name: HT                    # Make HT values available
      input_col: GoodJet
      output_col: ht

    - module_name: SimpleCategory
      input_col: "HLT.PFHT280_QuadPFJet30_PNet2BTagMean0p55"
      cat_name: PassHT
      bins: 2
      start: 0
      stop: 2

    - module_name: SimpleHistogram                                           
      hist_name: HT_before_selection_NOCUT 
      input_cols: [ht]                                                       
      axes:                                                                  
        - name: "HT"                                                         
          start: 0.0        
          stop: 2000.0                                                       
          bins: 60                                                       
          unit: GeV

    - module_name: NObjFilter #Spec that I want at least 4 
      selection_name: 'FourPlusGoodJets'
      input_col: GoodJet
      min_count: 4      

    - module_name: SimpleHistogram
      hist_name: HT_before_selection
      input_cols: [ht]
      axes:
        - name: "HT"
          start: 0.0
          stop: 2000.0
          bins: 60
          unit: GeV

    - module_name: SelectOnColumns
      sel_name: 'Selection'

    - module_name: SimpleHistogram
      hist_name: HTGood
      input_cols: [ht]
      axes:
        - name: "HT"
          start: 0.0
          stop: 2000.0
          bins: 60
          unit: GeV

    - module_name: ScalarSelection
      selection_name: 'HTGreaterHTFlat'
      input_col: ht
      cut_val: 400
      above: True

    - module_name: SelectOnColumns
      sel_name: 'Selection2'

    - module_name: SimpleHistogram
      hist_name: HT_aftercutHTFlat
      input_cols: [ht]
      axes:
        - name: "HT"
          start: 0.0
          stop: 2000.0
          bins: 60
          unit: GeV

    - module_name: PromoteIndex
      input_col: GoodJet
      output_col: FirstGoodJet
      index: 0

    - module_name: PromoteIndex
      input_col: GoodJet
      output_col: SecondGoodJet
      index: 1

    - module_name: PromoteIndex
      input_col: GoodJet
      output_col: ThirdGoodJet
      index: 2

    - module_name: PromoteIndex 
      input_col: GoodJet
      output_col: FourthGoodJet
      index: 3

    - module_name: Zip
      input_cols: 
        FirstGoodJet: FirstGoodJet
        SecondGoodJet: SecondGoodJet
        ThirdGoodJet: ThirdGoodJet
        FourthGoodJet: FourthGoodJet
      output_col: FirstFourGoodJets

    
    - module_name: SimpleHistogram
      hist_name: PTThird
      input_cols: [ThirdGoodJet.pt]
      axes:
        - name: "PT3"
          start: 0.0
          stop: 600.0
          bins: 50
          unit: GeV

    - module_name: SimpleHistogram
      hist_name: PTSecond
      input_cols: [SecondGoodJet.pt]
      axes:
        - name: "PT2"
          start: 0.0
          stop: 400.0
          bins: 50
          unit: GeV

    - module_name: SimpleHistogram
      hist_name: PTFirst
      input_cols: [FirstGoodJet.pt]
      axes:
        - name: "PT1"
          start: 0.0
          stop: 400.0
          bins: 50
          unit: GeV

    - module_name: SimpleHistogram
      hist_name: PTFourth
      input_cols: [FourthGoodJet.pt]
      axes:
        - name: "PT4"
          start: 0.0
          stop: 400.0
          bins: 50
          unit: GeV

    - module_name: ScalarSelection
      selection_name: 'PT4GreaterPT4Flat'
      input_col: FourthGoodJet.pt
      cut_val: 60
      above: True
   
    - module_name: SelectOnColumns
      sel_name: 'PT4GreaterPT4Flat'

    - module_name: BQuarkMaker
      input_col: GoodJet
      output_col: BGoodJet
      working_point: 'T'

    - module_name: NObjFilter
      selection_name: TwoBJet
      input_col: BGoodJet
      min_count: 2

    - module_name: SelectTopN
      input_col: GoodJet      
      sort_field: pt
      n: 4
      output_col: GoodJet_top4pt

    - module_name: SortByBtagScore
      input_col: GoodJet_top4pt
      btag_field: btagDeepFlavB
      output_col: GoodJet_top4pt_btagsorted

    - module_name: PromoteIndex
      input_col: GoodJet_top4pt_btagsorted.btagDeepFlavB
      output_col: GoodJet_Brankone
      index: 0

    - module_name: PromoteIndex
      input_col: GoodJet_top4pt_btagsorted.btagDeepFlavB
      output_col: GoodJet_Branktwo
      index: 1

    - module_name: BtagDisc
      input_col_first_rank: GoodJet_Brankone
      input_col_second_rank: GoodJet_Branktwo
      output_col: 'btag_discriminant'

    - module_name: SimpleHistogram
      hist_name: Highest_2_Btag_Avg
      input_cols: ['btag_discriminant']
      axes:
        - name: "Average of Btag1 & Btag2 per event"
          start: 0.0
          stop: 1.0
          bins: 20
          unit: score

    - module_name: SimpleHistogram
      hist_name: Btag_1
      input_cols: ['GoodJet_Brankone']
      axes:
        - name: "BtagDisc"
          start: 0.0
          stop: 1.0
          bins: 50
          unit: score

    - module_name: SimpleHistogram
      hist_name: Btag_2
      input_cols: ['GoodJet_Branktwo']
      axes:
        - name: "BtagDisc"
          start: 0.0
          stop: 1.0
          bins: 50
          unit: score

    - module_name: SelectOnColumns
      sel_name: 'TwoTightBJets'

    - module_name: SimpleHistogram
      hist_name: HT_after_all_sel
      input_cols: [ht]
      axes:
        - name: "HT"
          start: 0.0
          stop: 2000.0
          bins: 60
          unit: GeV

event_collections:
  - dataset: '*run3hlt*'
    pipelines: [supercool_first_pipeline]
  - dataset: '*qcd*2023*preB*'
    pipelines: [supercool_first_pipeline]

location_priorities: [".*(T0|T1|T2).*","eos"]

Postprocessing: 
  default_plot_config:
    cms_text: ""
    image_type: ".png"
  default_style_set:
    styles:
      - pattern:
          dataset_name: "qcd*"
        style:
          plottype: fill

  processors:
    - name: Histogram1D
      inputs:
        - "*/*/*/HT_before_selection"
      normalize: True
      structure:
        group: {name: "*"}
        subgroups:
          stacked:
            select: {dataset_name: "*qcd*2023*preB*"}
          unstacked:
            select: {dataset_name: "signal*"}
        transforms:
          - name: SelectAxesValues
            select_axes_values: {variation: ["central"], "PassHT":[1]}
          - name: SetStyle
            style:
              plottype: fill
              color: blue
              alpha: 0.5
            should_run:
              dataset_name: "qcd*"
      output_name: "{prefix}/QCD_Comparisons_HT_nosel/QCDCompare_{name}.png"

    - name: Histogram1D
      inputs: 
        - "*/*/*/PTFirst"
        - "*/*/*/PTSecond"
        - "*/*/*/PTThird"
        - "*/*/*/PTFourth"
      normalize: True
      structure:
        group: {name: "*"}
        subgroups:
          stacked:
            select: {dataset_name: "*qcd*2023*preB*"}
          unstacked:
            select: {dataset_name: "signal*"}
        transforms:
          - name: SelectAxesValues
            select_axes_values: {variation: ["central"], "PassHT":[1]}
          - name: SetStyle
            style:
              plottype: fill
              color: blue
              alpha: 0.5 
            should_run: 
              dataset_name: "qcd*"
      output_name: "{prefix}/QCD_Comparisons_PT/QCDCompare_{name}.png"

    - name: Histogram1D
      inputs:
        - "*/*/*/PTSecond"
        - "*/*/*/PTThird"
        - "*/*/*/PTFourth"
      normalize: True
      structure:
        group: {pipeline: "*"}
        subgroups:
          stacked:
            select: {dataset_name: "qcd_inclusive_2023_preBPi*"}
          unstacked:
            select: {dataset_name: "signal*"}
            transforms:
              - name: SumHistograms
                sum_match_pattern: {pipeline: "*"}
                new_meta_fields: {title: "2nd through 4th leading jet Pt sum"}
        transforms:
          - name: SelectAxesValues
            select_axes_values: {variation: ["central"], "PassHT":[1]}
          - name: SetStyle
            style:
              plottype: fill
              color: blue
              alpha: 0.5
            should_run:
              dataset_name: "qcd*"
      output_name: "{prefix}/QCD_Comparisons_PT2thru4/QCDCompare.png"

    - name: Histogram1D
      inputs:
        - "*/*/*/Btag_1"
        - "*/*/*/Btag_2"
      normalize: True
      structure:
        group: {name: "*"}
        subgroups:
          stacked:
            select: {dataset_name: "*qcd*2023*preB*"}
          unstacked:
            select: {dataset_name: "signal*"}
        transforms:
          - name: SelectAxesValues
            select_axes_values: {variation: ["central"], "PassHT":[1]}
          - name: SetStyle
            style:
              plottype: fill
              color: blue
              alpha: 0.5
            should_run:
              dataset_name: "qcd*"
      output_name: "{prefix}/QCD_Comparisons_BtagScore/QCDCompare_{name}.png"

    - name: RatioPlot
      inputs: 
        - "*/*/*/HTGood"
      ratio_type: "efficiency"
      structure: 
        group: {dataset_name: "*"}
        subgroups:  
          numerator: 
            transforms: 
              - name: SelectAxesValues
                select_axes_values: {"variation": ["central"],"PassHT":[1]}
          denominator:
            transforms: 
              - name: SelectAxesValues
                select_axes_values: {"variation": ["central"]}
              - name: MergeAxes
                merge_axis_names: ["PassHT"] 
      output_name: "{prefix}/Ht_plots/{dataset_name}/ratio_{era.name}_{name}.png"
        
    - name: RatioPlot
      inputs:
        - "*/*/*/PTFourth"
        - "*/*/*/PTThird"
        - "*/*/*/PTSecond"
        - "*/*/*/PTFirst"
      ratio_type: "efficiency"
      structure:
        group: {dataset_name: "*"}
        subgroups:
          numerator:
            transforms:
              - name: SelectAxesValues
                select_axes_values: {"variation": ["central"],"PassHT":[1]}
          denominator:
            transforms:
              - name: SelectAxesValues
                select_axes_values: {"variation": ["central"]}
              - name: MergeAxes
                merge_axis_names: ["PassHT"]
      output_name: "{prefix}/jet_pt_plots/{dataset_name}/ratio_{era.name}_{name}.png"

    - name: RatioPlot
      inputs:
        - "*/*/*/Highest_2_Btag_Avg"
      ratio_type: "efficiency"
      structure:
        group: {dataset_name: "*"}
        subgroups:
          numerator:
            transforms:
              - name: SelectAxesValues
                select_axes_values: {"variation": ["central"],"PassHT":[1]}
          denominator:
            transforms:
              - name: SelectAxesValues
                select_axes_values: {"variation": ["central"]}
              - name: MergeAxes
                merge_axis_names: ["PassHT"]
      output_name: "{prefix}/btag_avghighesttwo_plots/{dataset_name}/mean_ratio_{era.name}_{name}.png"

    - name: RatioPlot
      inputs:
        - "*/*/*/Btag_1"
        - "*/*/*/Btag_2"
      ratio_type: "efficiency"
      structure:
        group: {dataset_name: "*"}
        subgroups:
          numerator:
            transforms:
              - name: SelectAxesValues
                select_axes_values: {"variation": ["central"],"PassHT":[1]}
          denominator:
            transforms:
              - name: SelectAxesValues
                select_axes_values: {"variation": ["central"]}
              - name: MergeAxes
                merge_axis_names: ["PassHT"]
      output_name: "{prefix}/btag_rank_plots/{dataset_name}/rank1_ratio_{era.name}_{name}.png"
